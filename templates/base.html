<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}MedBook{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="/doctors/">Каталог врачей</a> |
        <a href="/doctors/create/">Добавить врача</a> |
        <a href="/doctors/specializations/">Специализации</a>
    </nav>
    <hr>

    {% if messages %}
        <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
        <hr>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
