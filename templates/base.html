<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}MedBook{% endblock %}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f8fafc; color: #333; line-height: 1.5; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        nav { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 14px 20px; margin-bottom: 25px; display: flex; gap: 20px; align-items: center; }
        nav a { text-decoration: none; color: #0d6efd; font-weight: 600; font-size: 15px; }
        nav a:hover { text-decoration: underline; }
        .error { background: #fee2e2; color: #dc2626; padding: 12px; border-radius: 6px; font-weight: 500; margin-bottom: 20px; border: 1px solid #fecaca; }
        label { display: block; margin-top: 12px; font-weight: 600; font-size: 14px; }
        input[type="text"], input[type="password"], input[type="email"], input[type="number"], select, textarea {
            width: 100%; max-width: 420px; padding: 8px 10px; margin-top: 4px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;
        }
        button, .btn { display: inline-block; padding: 8px 16px; background: #0d6efd; color: #fff; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px; font-weight: 500; }
        button:hover, .btn:hover { background: #0b5ed7; }
        .btn-outline { background: #fff; color: #475569; border: 1px solid #cbd5e1; }
        .btn-outline:hover { background: #f1f5f9; color: #1e293b; }
    </style>
</head>
<body>
    <nav>
        <strong style="color: #0f172a; font-size: 17px; margin-right: 10px;">MedBook</strong>
        <a href="/doctors/">Все врачи</a>
        <a href="/doctors/create/">+ Добавить врача</a>
        <a href="/doctors/specializations/">Специализации</a>
    </nav>
    <div class="container">
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
