{% extends 'base.html' %}

{% block title %}Запись на приём — MedClinic{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-xl">
        <div class="flex items-center space-x-3 mb-6 pb-4 border-b border-slate-800">
            <div class="w-10 h-10 rounded-xl bg-teal-500/10 border border-teal-500/20 flex items-center justify-center text-teal-400">
                <i class="fa-solid fa-calendar-plus text-lg"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white">Записаться на приём</h1>
                <p class="text-xs text-slate-400">Выберите удобную дату и время для визита</p>
            </div>
        </div>

        <form method="post" class="space-y-5 [&_p]:space-y-2 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_label]:text-slate-300 [&_input]:w-full [&_input]:bg-slate-950 [&_input]:border [&_input]:border-slate-700 [&_input]:rounded-xl [&_input]:px-4 [&_input]:py-2.5 [&_input]:text-white [&_input]:focus:outline-none [&_input]:focus:border-teal-500">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="pt-4 flex items-center justify-end space-x-3">
                <a href="{% url 'appointments:my_appointments' %}" class="px-4 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 transition">
                    Отмена
                </a>
                <button type="submit" class="px-6 py-2.5 rounded-xl text-sm font-medium bg-gradient-to-r from-teal-500 to-emerald-600 text-white shadow-lg shadow-teal-500/20 hover:from-teal-400 hover:to-emerald-500 transition">
                    Подтвердить запись
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
