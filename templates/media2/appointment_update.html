<h2>
    {% if form.instance.pk %}
        Редактировать запись к врачу {{ doctor.user.get_full_name }}
    {% else %}
        Записаться на прием к врачу {{ doctor.user.get_full_name }}
    {% endif %}
</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
</form>
