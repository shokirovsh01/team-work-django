{% extends 'base.html' %}

{% block title %}Редактирование сведений о клинике — MedClinic{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">

    <!-- Назад -->
    <div>
        <a href="{% url 'clinic_detail' %}" class="inline-flex items-center text-sm font-medium text-slate-400 hover:text-white transition">
            <i class="fa-solid fa-arrow-left mr-2 text-teal-400"></i> Назад к странице клиники
        </a>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-xl space-y-5">
        
        <div>
            <h1 class="text-xl font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-hospital text-teal-400"></i>
                <span>Редактирование данных клиники</span>
            </h1>
            <p class="text-xs text-slate-400 mt-1">Обновите адрес, телефон, описание и часы приёма</p>
        </div>

        <form method="post" class="space-y-4 [&_p]:space-y-1.5 [&_label]:block [&_label]:text-xs [&_label]:font-medium [&_label]:text-slate-300 [&_input]:w-full [&_input]:px-4 [&_input]:py-2.5 [&_input]:bg-slate-800 [&_input]:border [&_input]:border-slate-700 [&_input]:rounded-xl [&_input]:text-sm [&_input]:text-slate-100 [&_input]:focus:outline-none [&_input]:focus:border-teal-500 [&_textarea]:w-full [&_textarea]:px-4 [&_textarea]:py-2.5 [&_textarea]:bg-slate-800 [&_textarea]:border [&_textarea]:border-slate-700 [&_textarea]:rounded-xl [&_textarea]:text-sm [&_textarea]:text-slate-100">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="pt-4 flex items-center justify-end space-x-3 border-t border-slate-800">
                <a href="{% url 'clinic_detail' %}" class="px-4 py-2.5 rounded-xl text-xs font-medium text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 transition">
                    Отмена
                </a>
                <button type="submit" class="px-6 py-2.5 rounded-xl text-xs font-semibold bg-gradient-to-r from-teal-500 to-emerald-600 text-white shadow-lg shadow-teal-500/20 hover:from-teal-400 hover:to-emerald-500 transition">
                    Сохранить изменения
                </button>
            </div>
        </form>

    </div>

</div>
{% endblock %}
