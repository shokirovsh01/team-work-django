<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
</head>
<body>
    <h1>Profile</h1>

    <p>Welcome, <strong>{{ user.username }}</strong>!</p>
    <p>Email: {{ user.email }}</p>
    <p>Phone: {{ user.phone}}</p>
    <p>Date_birth: {{ user.date_of_birth}}</p>
    <form action="{% url 'logout' %}" method="post">
        {% csrf_token %}
        <button type="submit">logout</button>
    </form>
</body>
</html>
